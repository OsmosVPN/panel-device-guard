<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Device Guard{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <style>
      body {
        background: #f0f2f5;
      }
      .navbar-brand {
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .badge-ip {
        font-size: 0.75rem;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark mb-4 px-3">
      <span class="navbar-brand">🛡 Device Guard</span>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-light btn-sm" href="/active">Активные</a>
        <a class="btn btn-outline-light btn-sm" href="/banned"
          >Заблокированные</a
        >
        <a class="btn btn-outline-light btn-sm" href="/nodes">Ноды</a>
        <a class="btn btn-outline-light btn-sm" href="/logout">Выйти</a>
      </div>
    </nav>
    <div class="container pb-5">{% block content %}{% endblock %}</div>
    {% block scripts %}{% endblock %}
  </body>
</html>
