<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Device Guard — Вход</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f0f2f5;
        display: flex;
        align-items: center;
        min-height: 100vh;
      }
      .login-card {
        width: 100%;
        max-width: 380px;
      }
    </style>
  </head>
  <body>
    <div class="container d-flex justify-content-center">
      <div class="login-card card shadow-sm p-4">
        <h4 class="mb-4 text-center fw-bold">🛡 Device Guard</h4>
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" autocomplete="off">
          <div class="mb-3">
            <label class="form-label">Логин</label>
            <input
              type="text"
              name="username"
              class="form-control"
              autofocus
              required
              autocomplete="username"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input
              type="password"
              name="password"
              class="form-control"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn btn-dark w-100">Войти</button>
        </form>
      </div>
    </div>
  </body>
</html>
