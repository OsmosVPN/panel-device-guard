<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Guard - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 min-h-screen flex items-center justify-center"
  >
    <div class="w-full max-w-md">
      <div
        class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-8"
      >
        <div class="text-center mb-8">
          <div class="text-4xl mb-3">🛡️</div>
          <h1 class="text-3xl font-bold text-white">Device Guard</h1>
          <p class="text-gray-400 text-sm mt-1">Device control system</p>
        </div>

        <form method="post" action="/login" class="space-y-4">
          {% if error %}
          <div
            class="bg-red-900/20 border border-red-800 text-red-300 px-4 py-3 rounded-lg text-sm"
          >
            {{ error }}
          </div>
          {% endif %}

          <div>
            <label class="block text-gray-300 text-sm font-medium mb-2"
              >Username</label
            >
            <input
              type="text"
              name="username"
              placeholder="Enter username"
              required
              autocomplete="username"
              class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            />
          </div>

          <div>
            <label class="block text-gray-300 text-sm font-medium mb-2"
              >Password</label
            >
            <input
              type="password"
              name="password"
              placeholder="Enter password"
              required
              autocomplete="current-password"
              class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            />
          </div>

          <button
            type="submit"
            class="w-full px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition duration-200 transform hover:scale-105 active:scale-95"
          >
            Sign in
          </button>
        </form>

      </div>
    </div>
  </body>
</html>
