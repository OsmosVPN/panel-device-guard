<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Device Guard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .tab-active {
        @apply border-b-2 border-indigo-500 text-indigo-600;
      }
      .tab-inactive {
        @apply text-gray-500 hover:text-gray-700;
      }
      @keyframes spin-slow {
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-slow {
        animation: spin-slow 2s linear infinite;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-gray-100 min-h-screen">
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3">
        <div class="flex items-center justify-between mb-3">
          <h1 class="text-lg sm:text-2xl font-bold text-white">
            🛡️ Device Guard
          </h1>
          <a
            href="/logout"
            class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs sm:text-sm shrink-0"
            >Logout</a
          >
        </div>

        <div
          class="flex overflow-x-auto border-b border-slate-800 -mx-3 sm:-mx-4 px-3 sm:px-4 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
        >
          <a
            href="/?tab=active"
            class="pb-3 px-3 sm:px-4 whitespace-nowrap text-sm {% if tab == 'active' %}tab-active{% else %}tab-inactive{% endif %} font-medium transition shrink-0"
          >
            👥 Active
          </a>
          <a
            href="/?tab=banned"
            class="pb-3 px-3 sm:px-4 whitespace-nowrap text-sm {% if tab == 'banned' %}tab-active{% else %}tab-inactive{% endif %} font-medium transition shrink-0"
          >
            🚫 Banned
          </a>
          <a
            href="/?tab=info"
            class="pb-3 px-3 sm:px-4 whitespace-nowrap text-sm {% if tab == 'info' %}tab-active{% else %}tab-inactive{% endif %} font-medium transition shrink-0"
          >
            ℹ️ Info
          </a>
          <a
            href="/?tab=logs"
            class="pb-3 px-3 sm:px-4 whitespace-nowrap text-sm {% if tab == 'logs' %}tab-active{% else %}tab-inactive{% endif %} font-medium transition shrink-0"
          >
            📋 Logs
          </a>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
